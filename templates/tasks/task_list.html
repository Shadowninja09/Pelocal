{% extends 'base.html' %}

{% block title %}Task List - To-Do List{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-tasks me-2"></i>My Tasks</h2>
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-outline-primary" onclick="filterTasks('')">
                    All Tasks
                </button>
                <button type="button" class="btn btn-outline-secondary" onclick="filterTasks('pending')">
                    Pending
                </button>
                <button type="button" class="btn btn-outline-warning" onclick="filterTasks('in_progress')">
                    In Progress
                </button>
                <button type="button" class="btn btn-outline-success" onclick="filterTasks('completed')">
                    Completed
                </button>
            </div>
        </div>

        <!-- Loading indicator -->
        <div class="text-center loading" id="loading-indicator">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Loading tasks...</p>
        </div>

        <!-- Tasks container -->
        <div id="tasks-container">
            <!-- Tasks will be loaded here -->
        </div>

        <!-- Empty state -->
        <div class="text-center py-5" id="empty-state" style="display: none;">
            <i class="fas fa-clipboard-list fa-3x text-muted mb-3"></i>
            <h4 class="text-muted">No tasks found</h4>
            <p class="text-muted">Start by adding your first task!</p>
            <a href="{% url 'add_task' %}" class="btn btn-primary">
                <i class="fas fa-plus me-2"></i>Add Task
            </a>
        </div>
    </div>
</div>

<!-- Task Modal for editing -->
<div class="modal fade" id="editTaskModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Task</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editTaskForm">
                    <div class="mb-3">
                        <label for="editTitle" class="form-label">Title</label>
                        <input type="text" class="form-control" id="editTitle" required maxlength="200">
                    </div>
                    <div class="mb-3">
                        <label for="editDescription" class="form-label">Description</label>
                        <textarea class="form-control" id="editDescription" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="editDueDate" class="form-label">Due Date</label>
                        <input type="date" class="form-control" id="editDueDate">
                    </div>
                    <div class="mb-3">
                        <label for="editStatus" class="form-label">Status</label>
                        <select class="form-select" id="editStatus">
                            <option value="pending">Pending</option>
                            <option value="in_progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="updateTask()">
                    <span class="loading spinner-border spinner-border-sm me-2" style="display: none;"></span>
                    Update Task
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentTasks = [];
let currentFilter = '';

// Load tasks on page load
document.addEventListener('DOMContentLoaded', function() {
    loadTasks();
});

function loadTasks(status = '') {
    const loadingIndicator = document.getElementById('loading-indicator');
    const tasksContainer = document.getElementById('tasks-container');
    const emptyState = document.getElementById('empty-state');
    
    loadingIndicator.style.display = 'block';
    tasksContainer.innerHTML = '';
    emptyState.style.display = 'none';
    
    const url = status ? `/api/tasks/list/?status=${status}` : '/api/tasks/list/';
    
    fetch(url)
        .then(response => response.json())
        .then(data => {
            loadingIndicator.style.display = 'none';
            
            if (data.status === 'success') {
                currentTasks = data.data;
                renderTasks(currentTasks);
            } else {
                showAlert(data.message || 'Failed to load tasks', 'error');
            }
        })
        .catch(error => {
            loadingIndicator.style.display = 'none';
            console.error('Error:', error);
            showAlert('Failed to load tasks', 'error');
        });
}

function renderTasks(tasks) {
    const tasksContainer = document.getElementById('tasks-container');
    const emptyState = document.getElementById('empty-state');
    
    if (tasks.length === 0) {
        tasksContainer.innerHTML = '';
        emptyState.style.display = 'block';
        return;
    }
    
    emptyState.style.display = 'none';
    
    const tasksHtml = tasks.map(task => `
        <div class="card task-card mb-3">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start">
                    <div class="flex-grow-1">
                        <h5 class="card-title">${escapeHtml(task.title)}</h5>
                        ${task.description ? `<p class="card-text">${escapeHtml(task.description)}</p>` : ''}
                        <div class="d-flex align-items-center gap-3">
                            <span class="badge ${getStatusBadgeClass(task.status)} status-badge">
                                ${getStatusText(task.status)}
                            </span>
                            <small class="due-date">
                                <i class="fas fa-calendar me-1"></i>
                                ${formatDate(task.due_date)}
                            </small>
                            <small class="text-muted">
                                <i class="fas fa-clock me-1"></i>
                                Created: ${formatDate(task.created_at)}
                            </small>
                        </div>
                    </div>
                    <div class="task-actions">
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-primary" onclick="editTask(${task.id})" title="Edit">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-outline-danger" onclick="deleteTask(${task.id})" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `).join('');
    
    tasksContainer.innerHTML = tasksHtml;
}

function filterTasks(status) {
    currentFilter = status;
    loadTasks(status);
    
    // Update button states
    document.querySelectorAll('.btn-group .btn').forEach(btn => {
        btn.classList.remove('active');
    });
    
    const buttons = {
        '': document.querySelector('button[onclick="filterTasks(\'\')"]'),
        'pending': document.querySelector('button[onclick="filterTasks(\'pending\')"]'),
        'in_progress': document.querySelector('button[onclick="filterTasks(\'in_progress\')"]'),
        'completed': document.querySelector('button[onclick="filterTasks(\'completed\')"]')
    };
    
    if (buttons[status]) {
        buttons[status].classList.add('active');
    }
}

function editTask(taskId) {
    const task = currentTasks.find(t => t.id === taskId);
    if (!task) return;
    
    document.getElementById('editTitle').value = task.title;
    document.getElementById('editDescription').value = task.description || '';
    document.getElementById('editDueDate').value = task.due_date || '';
    document.getElementById('editStatus').value = task.status;
    
    const modal = new bootstrap.Modal(document.getElementById('editTaskModal'));
    modal.show();
    
    // Store task ID for update
    document.getElementById('editTaskModal').dataset.taskId = taskId;
}

function updateTask() {
    const taskId = document.getElementById('editTaskModal').dataset.taskId;
    const title = document.getElementById('editTitle').value.trim();
    const description = document.getElementById('editDescription').value.trim();
    const dueDate = document.getElementById('editDueDate').value;
    const status = document.getElementById('editStatus').value;
    
    if (!title) {
        showAlert('Title is required', 'error');
        return;
    }
    
    const updateButton = document.querySelector('#editTaskModal .btn-primary');
    showLoading(updateButton);
    
    const data = {
        title: title,
        description: description || null,
        due_date: dueDate || null,
        status: status
    };
    
    fetch(`/api/tasks/${taskId}/update/`, {
        method: 'PUT',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(data => {
        hideLoading(updateButton);
        
        if (data.status === 'success') {
            showAlert('Task updated successfully');
            bootstrap.Modal.getInstance(document.getElementById('editTaskModal')).hide();
            loadTasks(currentFilter);
        } else {
            showAlert(data.message || 'Failed to update task', 'error');
        }
    })
    .catch(error => {
        hideLoading(updateButton);
        console.error('Error:', error);
        showAlert('Failed to update task', 'error');
    });
}

function deleteTask(taskId) {
    if (!confirm('Are you sure you want to delete this task?')) {
        return;
    }
    
    fetch(`/api/tasks/${taskId}/delete/`, {
        method: 'DELETE'
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            showAlert('Task deleted successfully');
            loadTasks(currentFilter);
        } else {
            showAlert(data.message || 'Failed to delete task', 'error');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        showAlert('Failed to delete task', 'error');
    });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
{% endblock %}
